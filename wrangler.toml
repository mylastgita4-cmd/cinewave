
name = "cinewave"
main = "worker.js"
compatibility_date = "2026-10-17"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
METADATA_PROVIDER = "itunes"
TORRENT_PROVIDER = "yts"

CACHE_TTL = "3600"
TORRENT_CACHE_TTL = "900"

RATE_LIMIT_MAX = "30"
RATE_LIMIT_WINDOW = "60"

# Optional: allowed website origins, separated by commas.
ALLOWED_ORIGINS = ""

[[kv_namespaces]]
binding = "CACHE"
id = "1df33e9670cf4f469813aa66d8112920"
